<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the last theme before first paint so a reload doesn't flash General.
      // Key must match themeStorageKey in src/theme/storage.ts (a test checks this).
      try {
        var theme = localStorage.getItem('game-companion.theme')
        if (theme) document.documentElement.dataset.theme = theme
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
